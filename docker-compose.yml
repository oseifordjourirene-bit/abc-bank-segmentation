# ABC Bank drift model: pipeline + API + monitoring + dashboard on one machine.
#
#   1. Copy .env.example to .env and set ANON_SALT (never commit .env).
#   2. Put santander_sample.csv in data/raw/ (data is never in the repository).
#   3. docker compose run --rm pipeline      # Module 3: clean, validate, anonymise
#      docker compose run --rm monitoring    # monthly checks (+ retraining when drift is found)
#      docker compose up -d api dashboard    # serve the API (:8000/docs) and dashboard (:8501)
services:
  pipeline:
    build: {context: ., dockerfile: Dockerfile}
    env_file: .env
    volumes: ["./data:/app/data", "./reports:/app/reports", "./logs:/app/logs", "./gx:/app/gx"]
    profiles: ["jobs"]

  monitoring:
    build: {context: ., dockerfile: Dockerfile.monitoring}
    volumes: ["./data:/app/data:ro", "./reports:/app/reports", "./models:/app/models",
              "./mlflow.db:/app/mlflow.db", "./mlruns:/app/mlruns"]
    profiles: ["jobs"]

  api:
    build: {context: ., dockerfile: Dockerfile.api}
    ports: ["8000:7860"]
    volumes: ["./logs:/app/logs"]
    restart: unless-stopped

  dashboard:
    build: {context: ., dockerfile: dashboard/Dockerfile}
    ports: ["8501:8501"]
    volumes: ["./reports:/app/reports:ro"]
    depends_on: [api]
    restart: unless-stopped
