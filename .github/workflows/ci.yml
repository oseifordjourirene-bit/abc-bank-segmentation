# CI/CD for the ABC Bank drift project
#  - every push and pull request: lint + full test suite (no customer data needed: tests use synthetic data)
#  - every push and pull request: build the three Docker images (pipeline, API, monitoring)
#  - push to main: deploy the API to Hugging Face Spaces (Streamlit Cloud redeploys the dashboard itself)
name: ci-cd

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  pipeline-tests:
    # Module 3 pipeline in its own environment (the same one the pipeline Docker image uses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt
      - name: Pipeline tests (cleaning, validation, anonymisation, features, bias)
        env:
          ANON_SALT: ci-only-test-salt
        run: pytest -q tests/test_clean.py tests/test_validation_rules.py tests/test_anonymise.py tests/test_features.py tests/test_audit_and_bias.py

  test:
    # Model, API, dashboard, monitoring and retraining (training library versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install dependencies
        run: pip install -r requirements-ci.txt
      - name: Lint (errors only)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Run tests
        env:
          ANON_SALT: ci-only-test-salt
        run: pytest -q --ignore=tests/test_validation_rules.py

  docker:
    runs-on: ubuntu-latest
    needs: [pipeline-tests, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build pipeline, API and monitoring images
        run: |
          docker build -f Dockerfile -t abc-pipeline .
          docker build -f Dockerfile.api -t abc-api .
          docker build -f Dockerfile.monitoring -t abc-monitoring .
      - name: Smoke-test the API container
        run: |
          docker run -d -p 7860:7860 --name api abc-api
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:7860/health && break; sleep 2; done
          curl -sf -X POST http://127.0.0.1:7860/predict -H "Content-Type: application/json" \
            -d @deploy/sample_request.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7860/predict \
            -H 'Content-Type: application/json' -d '{"age": 30}')" = "422"

  deploy-api:
    runs-on: ubuntu-latest
    needs: [pipeline-tests, test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Deploy to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          pip install "huggingface_hub>=0.24"
          python scripts/deploy_hf_space.py
